name: Snowflake API Integration CI
run-name: CI run by ${{ github.actor }} on ${{ github.ref_name }}

on:
  push:
    branches:
      - 'main'
      - 'feature/**'
      - 'bug/**'
    paths:
      - '*.tf'
      - 'examples/**'
      - 'tests/**'
      - 'utils/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - '*.tf'
      - 'examples/**'
      - 'tests/**'
      - 'utils/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================================
  # Terraform Validate (Snowflake API integration module)
  # ============================================================================
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    env:
      TF_VERSION: ${{ vars.TERRAFORM_VERSION || '1.5.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Lint Snowflake API integration module
        run: bash utils/lint.sh

  # ============================================================================
  # Validate Examples (basic + multi-cloud Snowflake API integrations)
  # ============================================================================
  examples-validate:
    name: Validate Examples
    runs-on: ubuntu-latest
    needs: terraform-validate
    env:
      TF_VERSION: ${{ vars.TERRAFORM_VERSION || '1.5.0' }}
    strategy:
      matrix:
        example:
          - examples/basic
          - examples/multi-cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ${{ matrix.example }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ matrix.example }}

  # ============================================================================
  # README Doc-Drift Check
  # ============================================================================
  docs-drift:
    name: README Doc-Drift Check
    runs-on: ubuntu-latest
    needs: terraform-validate
    env:
      TF_VERSION: ${{ vars.TERRAFORM_VERSION || '1.5.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install terraform-docs
        run: |
          curl -sSLo terraform-docs.tar.gz \
            https://terraform-docs.io/dl/v0.18.0/terraform-docs-v0.18.0-linux-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz terraform-docs
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Regenerate Inputs/Outputs tables
        run: bash utils/generate-docs.sh

      - name: Align GFM tables (markdownlint MD060)
        run: python3 utils/align-md-tables.py

      - name: Fail if README.md drifted from variables.tf / outputs.tf / main.tf
        run: |
          if ! git diff --quiet README.md; then
            echo "::error::README.md is out of sync with the Snowflake API integration module."
            echo "Run 'bash utils/generate-docs.sh && python3 utils/align-md-tables.py' locally and commit the result."
            git diff README.md
            exit 1
          fi

  # ============================================================================
  # Terratest Integration Tests (Snowflake API integration)
  # ============================================================================
  snowflake-api-integration-terratest:
    name: Snowflake API Integration Terratest
    runs-on: ubuntu-latest
    needs: examples-validate
    env:
      TF_VERSION: ${{ vars.TERRAFORM_VERSION || '1.5.0' }}
      GO_VERSION: ${{ vars.GO_VERSION || '1.21' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tests/go.sum

      - name: Download Go Dependencies
        run: |
          go mod tidy
          go mod download
        working-directory: tests

      - name: Run Terratest - Snowflake API Integration (basic)
        id: snowflake-api-integration-basic-test
        run: |
          set -o pipefail
          go test -v -timeout 30m -run TestSnowflakeApiIntegrationBasic 2>&1 \
            | tee snowflake_api_integration_basic_output.txt
          echo "## Snowflake API Integration (basic) Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat snowflake_api_integration_basic_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        working-directory: tests
        env:
          SNOWFLAKE_ORGANIZATION_NAME: ${{ vars.SNOWFLAKE_ORGANIZATION_NAME }}
          SNOWFLAKE_ACCOUNT_NAME: ${{ vars.SNOWFLAKE_ACCOUNT_NAME }}
          SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          TEST_AWS_ROLE_ARN: ${{ vars.TEST_AWS_ROLE_ARN }}
          TEST_AZURE_TENANT_ID: ${{ vars.TEST_AZURE_TENANT_ID }}
          TEST_AZURE_AD_APP_ID: ${{ vars.TEST_AZURE_AD_APP_ID }}
          TEST_GCP_AUDIENCE: ${{ vars.TEST_GCP_AUDIENCE }}

      - name: Update README badge (Snowflake API integration tests passed)
        if: success()
        run: |
          bash utils/update-badge.sh \
            --label "tests" --message "passing" --color "brightgreen"
        env:
          BADGE_GIST_ID: ${{ secrets.BADGE_GIST_ID }}
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}

  # ============================================================================
  # Generate Change Log
  # ============================================================================
  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs: examples-validate
    if: github.ref != 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update CHANGELOG.md [skip ci]"
          git push

  # ============================================================================
  # Semantic Release
  # ============================================================================
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [examples-validate, docs-drift, snowflake-api-integration-terratest]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer@13.0.0
            @semantic-release/release-notes-generator@14.0.0
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
            @semantic-release/github@11.0.0
            conventional-changelog-conventionalcommits@9.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README badge (Snowflake API integration release)
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          bash utils/update-badge.sh \
            --label "release" \
            --message "v${{ steps.semantic.outputs.new_release_version }}" \
            --color "blue"
        env:
          BADGE_GIST_ID: ${{ secrets.BADGE_GIST_ID }}
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
